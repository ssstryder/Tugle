<style>
  :root{
    --osso:#F4F1EA; --carvao:#17140F; --acento:#B8461F;
    --tinta-rgb:23,20,15;
    --linha:rgba(23,20,15,.15); --linha-forte:rgba(23,20,15,.38);
    --certo:#2F6B3A; --errado:#B8461F;
    --serif:"Instrument Serif", Georgia, serif;
    --sans:"Inter", system-ui, -apple-system, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html[data-tema="escuro"]{
    --osso:#161310; --carvao:#F1EDE4; --acento:#E2814F;
    --tinta-rgb:241,237,228;
    --linha:rgba(241,237,228,.14); --linha-forte:rgba(241,237,228,.3);
    --certo:#7FB98A;
  }
  html{background:var(--osso)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:var(--osso);color:var(--carvao);font-family:var(--sans);
    display:flex;flex-direction:column;transition:background .15s,color .15s}

  header{display:flex;align-items:center;gap:14px;padding:16px 20px;
    max-width:560px;margin:0 auto;width:100%}
  header .marca{font-family:var(--serif);font-size:26px;text-decoration:none;
    color:var(--carvao);line-height:1}
  header .marca i{font-style:italic;color:var(--acento)}
  header nav{margin-left:auto;display:flex;gap:16px}
  header nav a, header nav button{background:none;border:0;padding:0;cursor:pointer;
    font:500 13px/1 var(--sans);color:rgba(var(--tinta-rgb),.55);text-decoration:none}
  header nav a:hover, header nav button:hover{color:var(--carvao)}

  .pagina{max-width:560px;margin:0 auto;padding:0 20px 40px;width:100%;flex:1}
  .fita{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
    color:rgba(var(--tinta-rgb),.48);margin-bottom:10px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,9vw,60px);
    line-height:.9;margin:0 0 10px;letter-spacing:-.01em}
  h1 i{font-style:italic;color:var(--acento)}
  .subtitulo{margin:0 0 26px;font-size:14.5px;line-height:1.55;
    color:rgba(var(--tinta-rgb),.62)}

  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  select{appearance:none;padding:9px 30px 9px 11px;border:1px solid var(--linha-forte);
    border-radius:3px;background:var(--osso);color:var(--carvao);
    font:500 12.5px/1 var(--sans);cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
      linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size:5px 5px, 5px 5px;background-repeat:no-repeat}

  .fases{display:flex;gap:5px;margin-bottom:14px}
  .fase{flex:1;height:5px;border-radius:2px;background:rgba(var(--tinta-rgb),.1);
    transition:background .2s}
  .fase.ouvida{background:var(--acento)}
  .fase.falhada{background:rgba(var(--tinta-rgb),.28)}

  .painel{border:1px solid var(--linha);border-radius:4px;padding:22px;
    margin-bottom:18px}
  .duracao{font:600 34px/1 var(--serif);color:var(--acento);margin-bottom:3px}
  .duracao-nota{font-size:12.5px;color:rgba(var(--tinta-rgb),.5);margin-bottom:18px}

  .btn{appearance:none;cursor:pointer;text-decoration:none;text-align:center;
    font:500 14px/1 var(--sans);padding:13px 22px;border-radius:3px;
    background:var(--carvao);color:var(--osso);border:1px solid var(--carvao);
    transition:background .12s,border-color .12s,color .12s}
  .btn:hover{background:var(--acento);border-color:var(--acento)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:disabled:hover{background:var(--carvao);border-color:var(--carvao)}
  .btn.suave{background:transparent;color:rgba(var(--tinta-rgb),.65);
    border-color:var(--linha-forte)}
  .btn.suave:hover{background:transparent;color:var(--carvao);border-color:var(--carvao)}
  .btn.largo{width:100%}
  .linha-botoes{display:flex;gap:8px;margin-top:4px}
  .linha-botoes .btn{flex:1}

  .campo{position:relative;margin-bottom:10px}
  input[type=text]{width:100%;padding:12px 12px;border:1px solid var(--linha-forte);
    border-radius:3px;background:var(--osso);color:var(--carvao);
    font:400 14px/1.2 var(--sans)}
  input[type=text]:focus{outline:none;border-color:var(--acento)}
  .sugestoes{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:5;
    background:var(--osso);border:1px solid var(--linha-forte);border-radius:3px;
    max-height:210px;overflow-y:auto;display:none}
  .sugestoes.aberta{display:block}
  .sugestoes button{display:block;width:100%;text-align:left;background:none;
    border:0;border-bottom:1px solid var(--linha);padding:9px 11px;cursor:pointer;
    font:400 13.5px/1.3 var(--sans);color:var(--carvao)}
  .sugestoes button:last-child{border-bottom:0}
  .sugestoes button:hover,.sugestoes button.ativa{background:rgba(var(--tinta-rgb),.07)}
  .sugestoes .quem{display:block;font-size:11.5px;color:rgba(var(--tinta-rgb),.5);
    margin-top:2px}

  .tentativas{list-style:none;margin:16px 0 0;padding:0}
  .tentativas li{padding:9px 11px;border:1px solid var(--linha);border-radius:3px;
    margin-bottom:6px;font-size:13.5px;display:flex;align-items:center;gap:9px}
  .tentativas .marca{font:600 12px/1 var(--sans);color:rgba(var(--tinta-rgb),.45)}
  .tentativas li.errada .marca{color:var(--errado)}
  .tentativas li.passada{color:rgba(var(--tinta-rgb),.5)}

  .resultado{border:1px solid var(--linha-forte);border-radius:4px;padding:20px;
    margin-bottom:18px;display:flex;gap:16px;align-items:center}
  .resultado img{width:76px;height:76px;border-radius:3px;flex-shrink:0}
  .resultado .veredito{font:600 11px/1 var(--sans);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:7px}
  .resultado.acertou .veredito{color:var(--certo)}
  .resultado.falhou .veredito{color:var(--errado)}
  .resultado .titulo{font-family:var(--serif);font-size:23px;line-height:1.1;
    margin-bottom:3px}
  .resultado .artista{font-size:13.5px;color:rgba(var(--tinta-rgb),.6)}

  .placar{display:flex;gap:22px;margin-bottom:22px;padding-bottom:18px;
    border-bottom:1px solid var(--linha)}
  .placar div{font-size:12.5px;color:rgba(var(--tinta-rgb),.5)}
  .placar strong{display:block;font:400 25px/1.1 var(--serif);color:var(--carvao);
    margin-bottom:2px}

  .aviso{font-size:13px;padding:10px 12px;border-radius:3px;margin-bottom:12px;
    background:rgba(var(--tinta-rgb),.06);color:rgba(var(--tinta-rgb),.7)}
  .escondido{display:none}

  footer{display:flex;align-items:center;gap:10px;padding:20px;max-width:560px;
    margin:0 auto;width:100%;border-top:1px solid var(--linha);
    font:500 12px/1 var(--sans);color:rgba(var(--tinta-rgb),.4)}
  footer a{color:inherit;text-decoration:none}
  footer a:hover{color:var(--carvao)}
  footer span{color:rgba(var(--tinta-rgb),.25)}
</style>

    if (tema === "escuro") document.documentElement.setAttribute("data-tema", "escuro");
  } catch(e){}
})();
</script>

<audio id="leitor" preload="auto"></audio>

<script>
var FASES = [0.1, 0.5, 2, 8, 15];
var CHAVE_PLACAR = "tugle:adivinha:placar";

function el(s){ return document.querySelector(s); }
function baseURL(){ return ""; }
function normalizar(t){
  return (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toUpperCase().replace(/[^A-Z0-9]/g, "");
}

var atual = null;        // { id, audio }
var faseIndice = 0;
var tentativas = [];     // { texto, tipo }
var catalogo = [];       // títulos para as sugestões
var terminado = false;
var placar = { acertos: 0, jogadas: 0, sequencia: 0 };
var paragem = null;      // temporizador que corta o áudio no fim da fase

/* ---------------------------------------------------------------- tema */
el("#b-tema").onclick = function(){
  var escuro = document.documentElement.getAttribute("data-tema") === "escuro";
  if (escuro) document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema", "escuro");
  try { localStorage.setItem("tugle:tema", escuro ? "claro" : "escuro"); } catch(e){}
};

/* -------------------------------------------------------------- placar */
function carregarPlacar(){
  try {
    var s = localStorage.getItem(CHAVE_PLACAR);
    if (s) placar = JSON.parse(s);
  } catch(e){}
  mostrarPlacar();
}
function guardarPlacar(){
  try { localStorage.setItem(CHAVE_PLACAR, JSON.stringify(placar)); } catch(e){}
  mostrarPlacar();
}
function mostrarPlacar(){
  el("#p-acertos").textContent = placar.acertos || 0;
  el("#p-jogadas").textContent = placar.jogadas || 0;
  el("#p-sequencia").textContent = placar.sequencia || 0;
}

/* --------------------------------------------------------------- fases */
function desenharFases(){
  var caixa = el("#fases");
  caixa.innerHTML = "";
  for (var i = 0; i < FASES.length; i++){
    var d = document.createElement("div");
    d.className = "fase" + (i < faseIndice ? " falhada" : (i === faseIndice ? " ouvida" : ""));
    caixa.appendChild(d);
  }
  var seg = FASES[Math.min(faseIndice, FASES.length - 1)];
  el("#duracao").textContent = String(seg).replace(".", ",") + "s";
  el("#duracao-nota").textContent = faseIndice >= FASES.length - 1
    ? "última fase — é agora ou nunca"
    : "é tudo o que vais ouvir por agora";
}

/* ---------------------------------------------------------------- áudio */
function tocar(){
  if (!atual) return;
  var leitor = el("#leitor");
  clearTimeout(paragem);
  var segundos = FASES[Math.min(faseIndice, FASES.length - 1)];
  try {
    leitor.currentTime = 0;
    var promessa = leitor.play();
    if (promessa && promessa.catch) promessa.catch(function(){});
  } catch(e){}
  // o excerto da Deezer tem 30s; cortamos no tempo da fase atual
  paragem = setTimeout(function(){ leitor.pause(); }, segundos * 1000);
}
el("#b-tocar").onclick = tocar;

/* ----------------------------------------------------------- sugestões */
async function carregarCatalogo(){
  try {
    var r = await fetch(baseURL() + "/adivinha/titulos");
    if (r.ok) catalogo = await r.json();
  } catch(e){ catalogo = []; }
}
var indiceSugestao = -1;
function fecharSugestoes(){
  el("#sugestoes").classList.remove("aberta");
  indiceSugestao = -1;
}
function mostrarSugestoes(){
  var texto = normalizar(el("#palpite").value);
  var caixa = el("#sugestoes");
  if (texto.length < 2 || !catalogo.length){ fecharSugestoes(); return; }
  var achados = catalogo.filter(function(e){
    return normalizar(e.titulo).indexOf(texto) !== -1;
  }).slice(0, 8);
  if (!achados.length){ fecharSugestoes(); return; }
  caixa.innerHTML = "";
  achados.forEach(function(e){
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "";
    b.appendChild(document.createTextNode(e.titulo));
    var quem = document.createElement("span");
    quem.className = "quem";
    quem.textContent = e.artista;
    b.appendChild(quem);
    b.onclick = function(){
      el("#palpite").value = e.titulo;
      fecharSugestoes();
      el("#palpite").focus();
    };
    caixa.appendChild(b);
  });
  caixa.classList.add("aberta");
}
el("#palpite").addEventListener("input", mostrarSugestoes);
el("#palpite").addEventListener("blur", function(){ setTimeout(fecharSugestoes, 150); });
el("#palpite").addEventListener("keydown", function(ev){
  var caixa = el("#sugestoes");
  var botoes = caixa.querySelectorAll("button");
  if (ev.key === "Enter"){
    if (caixa.classList.contains("aberta") && indiceSugestao >= 0 && botoes[indiceSugestao]){
      ev.preventDefault();
      botoes[indiceSugestao].click();
      return;
    }
    ev.preventDefault();
    adivinhar();
    return;
  }
  if (!caixa.classList.contains("aberta") || !botoes.length) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    indiceSugestao += (ev.key === "ArrowDown" ? 1 : -1);
    if (indiceSugestao < 0) indiceSugestao = botoes.length - 1;
    if (indiceSugestao >= botoes.length) indiceSugestao = 0;
    for (var i = 0; i < botoes.length; i++) botoes[i].classList.toggle("ativa", i === indiceSugestao);
  }
  if (ev.key === "Escape") fecharSugestoes();
});

/* -------------------------------------------------------------- tentativas */
function desenharTentativas(){
  var lista = el("#tentativas");
  lista.innerHTML = "";
  tentativas.forEach(function(t){
    var li = document.createElement("li");
    li.className = t.tipo === "passou" ? "passada" : "errada";
    var marca = document.createElement("span");
    marca.className = "marca";
    marca.textContent = t.tipo === "passou" ? "PASSOU" : "ERRADO";
    li.appendChild(marca);
    li.appendChild(document.createTextNode(t.texto));
    lista.appendChild(li);
  });
}

function avancarFase(){
  faseIndice++;
  if (faseIndice >= FASES.length){ terminar(false); return; }
  desenharFases();
  tocar();
}

async function adivinhar(){
  if (terminado || !atual) return;
  var texto = el("#palpite").value.trim();
  if (!texto) return;
  el("#b-adivinhar").disabled = true;
  try {
    var r = await fetch(baseURL() + "/adivinha/tentativa", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: atual.id, palpite: texto }),
    });
    var dados = await r.json();
    if (dados.certo){ terminar(true); return; }
    tentativas.push({ texto: texto, tipo: "errou" });
    desenharTentativas();
    el("#palpite").value = "";
    fecharSugestoes();
    avancarFase();
  } catch(e){
    /* sem rede: não gasta fase, para não penalizar o jogador */
  } finally {
    el("#b-adivinhar").disabled = false;
  }
}
el("#b-adivinhar").onclick = adivinhar;

el("#b-passar").onclick = function(){
  if (terminado) return;
  tentativas.push({ texto: "—", tipo: "passou" });
  desenharTentativas();
  avancarFase();
};
el("#b-desistir").onclick = function(){ if (!terminado) terminar(false); };

/* ------------------------------------------------------------------ fim */
async function terminar(acertou){
  terminado = true;
  clearTimeout(paragem);
  el("#leitor").pause();
  placar.jogadas = (placar.jogadas || 0) + 1;
  if (acertou){
    placar.acertos = (placar.acertos || 0) + 1;
    placar.sequencia = (placar.sequencia || 0) + 1;
  } else {
    placar.sequencia = 0;
  }
  guardarPlacar();

  var info = null;
  try {
    var r = await fetch(baseURL() + "/adivinha/revelar/" + encodeURIComponent(atual.id));
    if (r.ok) info = await r.json();
  } catch(e){}

  var caixa = el("#resultado");
  caixa.className = "resultado " + (acertou ? "acertou" : "falhou");
  caixa.innerHTML = "";
  if (info && info.capa){
    var img = document.createElement("img");
    img.src = info.capa;
    img.alt = "";
    caixa.appendChild(img);
  }
  var texto = document.createElement("div");
  var veredito = document.createElement("div");
  veredito.className = "veredito";
  veredito.textContent = acertou
    ? "Acertaste em " + String(FASES[Math.min(faseIndice, FASES.length - 1)]).replace(".", ",") + "s"
    : "Era esta";
  texto.appendChild(veredito);
  var titulo = document.createElement("div");
  titulo.className = "titulo";
  titulo.textContent = info ? info.titulo : "(não consegui ir buscar o título)";
  texto.appendChild(titulo);
  if (info){
    var artista = document.createElement("div");
    artista.className = "artista";
    artista.textContent = info.artista + (info.decada ? " · " + info.decada + "s" : "");
    texto.appendChild(artista);
  }
  caixa.appendChild(texto);

  el("#jogo").classList.add("escondido");
  el("#fim").classList.remove("escondido");
}

/* --------------------------------------------------------------- ronda */
async function novaRonda(){
  terminado = false;
  faseIndice = 0;
  tentativas = [];
  atual = null;
  el("#fim").classList.add("escondido");
  el("#jogo").classList.add("escondido");
  el("#carregando").classList.remove("escondido");
  el("#carregando").textContent = "A escolher uma música…";
  el("#palpite").value = "";
  fecharSugestoes();
  desenharTentativas();

  var origem = el("#f-origem").value;
  var decada = el("#f-decada").value;
  var url = baseURL() + "/adivinha/nova?origem=" + encodeURIComponent(origem)
    + (decada ? "&decada=" + encodeURIComponent(decada) : "");
  try {
    var r = await fetch(url);
    if (!r.ok){
      var erro = await r.json().catch(function(){ return {}; });
      el("#carregando").textContent = erro.detail || "Não consegui escolher uma música com este filtro.";
      return;
    }
    atual = await r.json();
  } catch(e){
    el("#carregando").textContent = "Não consegui ligar ao servidor. Tenta outra vez.";
    return;
  }

  el("#leitor").src = atual.audio;
  el("#carregando").classList.add("escondido");
  el("#jogo").classList.remove("escondido");
  desenharFases();
  el("#palpite").focus();
}
el("#b-outra").onclick = novaRonda;
el("#f-origem").onchange = novaRonda;
el("#f-decada").onchange = novaRonda;

/* -------------------------------------------------------------- arranque */
(async function(){
  carregarPlacar();
  try {
    var r = await fetch(baseURL() + "/opcoes-modo");
    if (r.ok){
      var opcoes = await r.json();
      var sel = el("#f-decada");
      (opcoes.decadas || []).forEach(function(d){
        var o = document.createElement("option");
        o.value = d;
        o.textContent = d + "s";
        sel.appendChild(o);
      });
    }
  } catch(e){}
  carregarCatalogo();
  await novaRonda();
})();
</script>
